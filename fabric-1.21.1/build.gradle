plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_1211}"
    id 'maven-publish'
}

version = "${mod_version}+mc1.21.1"
group = project.maven_group

base {
    archivesName = "${archives_base_name}-1.21.1"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

loom {
    mods {
        "schemapart" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_1211}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
    }
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_schemapart" }
    }
}
